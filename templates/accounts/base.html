<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}PIJOBS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">PIJOBS</a>
      {% if user.is_authenticated %}
        <span class="text-white">
          {{ user.username }} ({{ user.role }})
          | <a href="{% url 'logout' %}" class="text-warning">Déconnexion</a>
        </span>
      {% endif %}
    </div>
  </nav>

  <div class="container mt-3">
    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags|default:'info' }}{% endif %}">
          {{ m }}
        </div>
      {% endfor %}
    {% endif %}
  </div>

  {% block content %}{% endblock %}
</body>
</html>
