<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found | IRP</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body{
            margin:0;
            font-family:'Poppins',sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#111827);
            color:white;
            text-align:center;
        }

        .box{
            max-width:500px;
            padding:40px;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:24px;
            backdrop-filter:blur(12px);
        }

        h1{
            font-size:90px;
            margin:0;
            color:#3b82f6;
        }

        h2{
            margin:10px 0;
        }

        p{
            color:rgba(255,255,255,0.7);
            margin-bottom:25px;
        }

        a{
            display:inline-block;
            padding:12px 18px;
            background:linear-gradient(135deg,#3b82f6,#06b6d4);
            color:white;
            text-decoration:none;
            border-radius:14px;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p style="color: blue">The page you are looking for doesn’t exist or has been moved.</p>

    <a href="/api/auth/login">Go Home</a>
</div>

</body>
</html>
