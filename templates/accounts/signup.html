<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Intelligent Recruitment Platform</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
            background:
                    linear-gradient(rgba(15,23,42,.78), rgba(15,23,42,.78)),
                    url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
        }

        .container{
            width:100%;
            max-width:760px;
        }

        .signup-card{
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(14px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:28px;
            padding:40px;
            box-shadow:0 10px 40px rgba(0,0,0,0.35);
            color:white;
        }

        .logo{
            width:80px;
            height:80px;
            margin:0 auto 20px;
            border-radius:22px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:30px;
            font-weight:700;
            background:linear-gradient(135deg,#3b82f6,#06b6d4);
            box-shadow:0 8px 25px rgba(59,130,246,.45);
        }

        h2{
            text-align:center;
            font-size:32px;
            margin-bottom:8px;
            font-weight:600;
        }

        .subtitle{
            text-align:center;
            color:rgba(255,255,255,0.75);
            margin-bottom:35px;
            font-size:14px;
        }

        .progress{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:20px;
            margin-bottom:35px;
        }

        .circle{
            width:42px;
            height:42px;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            display:flex;
            justify-content:center;
            align-items:center;
            font-weight:600;
            border:1px solid rgba(255,255,255,0.2);
            transition:0.3s;
        }

        .circle.active{
            background:linear-gradient(135deg,#3b82f6,#06b6d4);
            box-shadow:0 5px 20px rgba(59,130,246,.4);
        }

        .step{
            display:none;
        }

        .step.active{
            display:block;
            animation:fadeIn .4s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:18px;
        }

        .full-width{
            grid-column:1 / -1;
        }

        .input-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            font-weight:500;
            color:white;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:14px 16px;
            border:none;
            border-radius:14px;
            outline:none;
            background:rgba(255,255,255,0.12);
            color:white;
            border:1px solid transparent;
            transition:0.3s;
            font-size:14px;
        }

        textarea{
            min-height:120px;
            resize:vertical;
        }

        input::placeholder,
        textarea::placeholder{
            color:rgba(255,255,255,0.65);
        }

        select{
            color:white;
        }

        select option{
            color:black;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border:1px solid #3b82f6;
            background:rgba(255,255,255,0.18);
            box-shadow:0 0 0 4px rgba(59,130,246,.18);
        }

        .section-title{
            font-size:22px;
            margin-bottom:25px;
            margin-top:10px;
            font-weight:600;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#3b82f6,#06b6d4);
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s ease;
            margin-top:10px;
            box-shadow:0 8px 20px rgba(59,130,246,.35);
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 28px rgba(59,130,246,.45);
        }

        .footer-text{
            text-align:center;
            margin-top:25px;
            color:rgba(255,255,255,0.7);
            font-size:13px;
        }

        input[type="file"]{
            padding:12px;
            background:rgba(255,255,255,0.08);
        }

        @media(max-width:768px){

            .signup-card{
                padding:30px 24px;
            }

            .grid{
                grid-template-columns:1fr;
            }

            h2{
                font-size:26px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="signup-card">

        <div class="logo">
            IRP
        </div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Intelligent Recruitment Platform
        </p>

        <!-- PROGRESS -->
        <div class="progress">
            <div class="circle active" id="circle1">1</div>
            <div class="circle" id="circle2">2</div>
        </div>

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            <!-- STEP 1 -->
            <div class="step active" id="step1">

                <div class="grid">

                    <div class="input-group full-width">
                        <label>Select Role</label>

                        <select name="role" id="role">
                            <option value="">Choose Role</option>
                            <option value="RH">Recruiter</option>
                            <option value="CANDIDATE">Candidate</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" name="username" placeholder="Enter username">
                    </div>

                    <div class="input-group">
                        <label>CIN</label>
                        <input type="text" name="cin" placeholder="Enter CIN">
                    </div>

                    <div class="input-group">
                        <label>Real Name</label>
                        <input type="text" name="real_name" placeholder="Enter full name">
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="Enter email">
                    </div>

                    <div class="input-group full-width">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="Enter password">
                    </div>

                </div>

                <button type="button" onclick="nextStep()">
                    Continue
                </button>

            </div>

            <!-- STEP RH -->
            <div class="step" id="stepRH">

                <h3 class="section-title">
                    Company Information
                </h3>

                <div class="grid">

                    <div class="input-group">
                        <label>Company Name</label>
                        <input type="text" name="company_name" placeholder="Company name">
                    </div>

                    <div class="input-group">
                        <label>Sector</label>
                        <input type="text" name="sector" placeholder="Company sector">
                    </div>

                    <div class="input-group">
                        <label>Phone</label>
                        <input type="text" name="phone" placeholder="Phone number">
                    </div>

                    <div class="input-group">
                        <label>Address</label>
                        <input type="text" name="address" placeholder="Company address">
                    </div>

                    <div class="input-group">
                        <label>Location</label>
                        <input type="text" name="location" placeholder="Location">
                    </div>

                    <div class="input-group">
                        <label>Employees</label>
                        <input type="number" name="number_of_employees" placeholder="Number of employees">
                    </div>

                    <div class="input-group">
                        <label>Domains</label>
                        <input type="text" name="domains" placeholder="Domains">
                    </div>

                    <div class="input-group">
                        <label>Expertise</label>
                        <input type="text" name="expertise" placeholder="Expertise">
                    </div>

                    <div class="input-group full-width">
                        <label>Description</label>
                        <textarea name="description" placeholder="Company description"></textarea>
                    </div>

                </div>

                <button type="submit">
                    Create Recruiter Account
                </button>

            </div>

            <!-- STEP CANDIDATE -->
            <div class="step" id="stepCAND">

                <h3 class="section-title">
                    Candidate Information
                </h3>

                <div class="grid">

                    <div class="input-group full-width">
                        <label>Skills</label>
                        <input type="text" name="skills" placeholder="Python, Django, SQL...">
                    </div>

                    <div class="input-group">
                        <label>Experience</label>
                        <input type="text" name="experience" placeholder="Experience">
                    </div>

                    <div class="input-group">
                        <label>Education</label>
                        <input type="text" name="education" placeholder="Education">
                    </div>

                    <div class="input-group">
                        <label>Phone</label>
                        <input type="text" name="phone" placeholder="Phone number">
                    </div>

                    <div class="input-group">
                        <label>Birth Date</label>
                        <input type="date" name="birth_date">
                    </div>

                    <div class="input-group">
                        <label>CV Upload</label>
                        <input type="file" name="cv">
                    </div>

                    <div class="input-group full-width">
                        <label>Motivation Letter</label>
                        <input type="file" name="motivation_letter">
                    </div>

                    <div class="input-group full-width">
                        <label>Description</label>
                        <textarea name="description" placeholder="Tell us about yourself"></textarea>
                    </div>

                </div>

                <button type="submit">
                    Create Candidate Account
                </button>

            </div>

        </form>

        <div class="footer-text">
            AI Powered Recruitment System
        </div>

    </div>

</div>

<script>

    function nextStep() {

        let role = document.getElementById("role").value;

        if(!role){
            alert("Please select a role");
            return;
        }

        document.getElementById("step1").classList.remove("active");

        document.getElementById("circle2").classList.add("active");

        if(role === "RH"){
            document.getElementById("stepRH").classList.add("active");
        }
        else{
            document.getElementById("stepCAND").classList.add("active");
        }
    }

</script>

</body>
</html>
